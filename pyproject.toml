[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bikeshare-analytics"
version = "0.1.0"
description = "Bike-share reliability: observed service, information and experiment design"
requires-python = ">=3.10,<3.13"
dependencies = ["duckdb==1.4.2", "dbt-core==1.10.15", "dbt-duckdb==1.9.6", "pandas==2.3.3", "numpy==2.2.6", "scipy==1.15.3", "matplotlib==3.10.7", "requests==2.32.5", "statsmodels==0.14.5"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.6"]
[project.scripts]
bikeshare = "bikeshare_analytics.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
